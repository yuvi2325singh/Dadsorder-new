<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dadsorder-yuvraj</title>
    <link rel="stylesheet" href="offer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div class="container">
        <div class="content">
            <div class="icon">
            <h2>Update offer</h2>
            <a href="../dadsorder job/dadsorder job.html">
             <i class="fa-solid fa-xmark icon2"></i></a>
            </div>
            <div class="price-box">$

            </div>

                <div class="para">
                        By Clicking ‘Submit Offer’ you agree to the <a href="#">Terms and Conditions</a>
                    </div>
            </div>
            <div class="box">
                <textarea name="description" id="description" placeholder="Enter your offer description"></textarea>
            </div>
            <a href="../message/index.html" style="text-decoration: none;">
            <div class="button-box">
                <button>Submit offer</button>
            </div></a>
        </div>
