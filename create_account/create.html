<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dadsorder-yuvraj</title>
    <link rel="stylesheet" href="create.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="container">
        <div class="content">
            <div class="icon">
            <h1>New supplier account</h1>
            <i class="fa-solid fa-xmark icon2"></i>
            </div>
            <div class="details-grid">
                <div class="box">
                    <div class="email">First Name</div>
                    <input type="#" placeholder="Enter first name">
                </div>
                <div class="box">
                    <div class="email">Last Name</div>
                    <input type="#" placeholder="Enter last name">
                </div>
                <div class="box">
                    <div class="email">Suburb</div>
                    <input type="#" placeholder="Enter suburb">
                </div>
                <div class="box">
                    <div class="email">State</div>
                    <select name="State" id="State">
                        <option value="select state">select state</option>
                        <option value="USA">USA</option>
                        <option value="India">India</option>
                        <option value="Japan">Japan</option>
                    </select>
                </div>
                <div class="box">
                    <div class="email">E-mail</div>
                    <input type="#" placeholder="Enter e-mail">
                </div>
                <div class="box">
                    <div class="email">Phone Number</div>
                    <input type="#" placeholder="Enter phone number">
                </div>
                <div class="box">
                    <div class="email">ABN</div>
                    <input type="#" placeholder="Enter ABN">
                </div>
                <div class="box">
                    <div class="email">company Name (optional)</div>
                    <input type="#" placeholder="Enter company name">
                </div>
            </div>

            <div class="button-box">
                <button>Log in</button>
                <div class="footer">Don't have an account? <a href="#"> Create account</a></div>
            </div>
        </div>
    </div>
</body>

</html>
