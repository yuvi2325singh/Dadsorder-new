<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dadsorder</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>

     <nav class="navbar">
          <a href="../main_dadsorder/index.html" style="text-decoration: none;"> 
        <div class="logo">Dadsorder</div></a>
        <div class="nav-links">
            <a href="../dadsorder_job/dadsorder job.html">
            <button class="btn-browse">Browse Orders</button></a>
            <a href="../my_order/index.html">My Orders</a>
            <a href="../message/index.html">Private Messages</a>
            <div class="user-info">
                <a href="../notification/notification.html">
                <span><img src="Notification.png" alt="" width="24px"></span></a>
                <a href="../fullfill_profile/index.html">
                <img src="Ellipse 1.png" alt="User" class="avatar-small" width="24px">
                <span>John D.</span></a>
            </div>
        </div>
        <div class="icon-img"><img src="Notification.png" alt="" width="24px">
            <img src="icon-park-outline_hamburger-button.png" alt="" width="24px">
        </div>
    </nav>


    <main class="container">
        <h1>Profile</h1>

        <div class="profile-banner">
            <img src="Ellipse 1.png" alt="John D." class="avatar-large" width="50px" height="50px">
            <h2>John. D</h2>
        </div>

        <section class="form-section">
            <label>About Yourself <span>why you are the best baker</span></label>
            <textarea placeholder="Write here"></textarea>

            <label>Services Offered</label>
            <textarea placeholder="Write here"></textarea>

            <label>Portfolio <span>(Upload up to 20 images)</span></label>
            <div class="upload-box">
                <div class="plus-icon">+</div>
                <p>Add Image</p>
            </div>

            <label>Specialization</label>
            <textarea placeholder="Write here"></textarea>

        </section>

         <div class="avatar-circle">
                <img src="Frame 427319353.png" alt="" width="120px" height="120px">
            </div>

            <div class="form-container">
                <div class="input-group">
                    <label for="first name">First Name</label>
                    <input type="text" id="first-name" placeholder="John">
                </div>
                <div class="input-group">
                    <label for="last name">Last Name</label>
                    <input type="text" id="last-name" placeholder="Doe">
                </div>

            </div>

        <div class="actions">
            <button class="btn-save">Save changes</button>
            <button class="btn-cancel">Cancel</button>
        </div>
    </main>

</body>
</html>
